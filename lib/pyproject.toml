[project]
name = "katapult"
version = "0.8.0"
description = "Library to create projects with the Katapult template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "cookiecutter>=2.6.0",
    "docker>=7.1.0",
    "rich>=14.0.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
kat = "katapult:cli.main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
