filters:
  - filters/mermaid.lua

project:
  type: website
  output-dir: docs
  render:
    - README.md
    - srv/*
    - nbk/reports/*
    - nbk/wip/*
    - "!project_template/"

website:
  title: "{{cookiecutter.project_name}}"
  site-path: "/{{cookiecutter.project_slug}}/"
  favicon: assets/simple_catapult_favicon.svg
  navbar:
    logo: assets/katapult_logo.svg
    left:
      - href: srv/services.qmd
        text: Services
      - href: srv/documentation.qmd
        text: Documentation
      - href: srv/reports.qmd
        text: Reports
  page-footer:
    center: |
      <div class="footer-item">
        Powered by 
        <img src="/assets/katapult_logo.svg" height="50" style="vertical-align: middle; margin-right: 5px;">
      </div>

format:
  html:
    theme:
      - cosmo
      - brand
    css: srv/styles.css
    toc: true
    include-after-body:
      text: |
        <script type="module">
          async function initMermaid() {
            if (window.mermaid) return;
            const m = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
            m.default.initialize({ startOnLoad: false });
            await m.default.run();
          }
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => { void initMermaid(); });
          } else {
            void initMermaid();
          }
        </script>


